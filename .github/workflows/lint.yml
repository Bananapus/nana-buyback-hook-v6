name: lint
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  forge-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.0
      - name: Check formatting
        run: forge fmt --check
